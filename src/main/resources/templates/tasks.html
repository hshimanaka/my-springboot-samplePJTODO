<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<metacharset"=UTF-8">
		<title>タスク一覧</title>
	</head>
	<style>
		h1 {
			text-align: center;
			font-size: 36px;
			color: #212529;
			margin-bottom: 24px;
			}
		.new_btn button {
			position: fixed;
			bottom: 30px;
			right: 30px;
			display: block;
			font-size: 16px;
			background-color: green;
			color: white;
			margin: 10px;
			}
		.btn-edit {
			color: white;
			background-color: blue;
		}
		.btn-delet {
			color: white;
			background-color: red;
				}
		.notask {
			text-align: center;
			background-color: skyblue;
			width: 60%;
			margin: 0 auto;
		}
		.logout {
			text-align: right;
			margin-bottom: 20px;
		}
	</style>
	<body>
		<th:block class="container">
		<h1>タスク管理</h1>
		<div class="logout">
		<a th:href="@{/logout}">ログアウト</a>
		</div>
		<div th:if="${tasks == null or #lists.isEmpty(tasks)}" class="notask">
			<p>現在タスクは登録されていません。「新規作成」から追加してください。</p>
		</div>
		<th:block th:unless="${tasks == null or #lists.isEmpty(tasks)}">
		<table border="1" style="border-collapse: collapse; width: 100%; margin: 0 auto;">
		<tr>
		 <th>id</th>
		 <th>タイトル</th>
		 <th>内容</th>
		 <th>登録者</th>
		 <th>開始日</th>
		 <th>終了日</th>
		 <th>作成日時</th>
		 <th>更新日時</th>
		 <th>操作</th>
		</tr>
		<tr th:each="rec:${tasks}">
			<td th:text="${rec.id}"></td>
			<td th:text="${rec.title}"></td>
			<td th:text="${rec.content}"></td>
			<td th:text="${rec.username}"></td>
			<td th:text="${rec.start_date}"></td>
			<td th:text="${rec.end_date}"></td>
			<td th:text="${rec.created_at}"></td>
			<td th:text="${rec.updated_at}"></td>
			<td>
				<a th:href="@{/tasks/edit(id=${rec.id})}" class="btn-edit">編集</a>
				<a th:href="@{/tasks/delete(id=${rec.id})}" class="btn-delet">削除</a>
			</td>
		</tr>
		</table>
		</th:block>
		</div>
		<div class="new_btn">
		<a th:href="@{/tasks/new}">
			<button type="button">+ 新規作成</button>
		</a> 
		</div>
	</body>
</html>
