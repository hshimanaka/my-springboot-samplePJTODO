<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>タスク一覧</title>
	<style>
		h1 {
			text-align: center;
			font-size: 36px;
			color: #212529;
			margin-bottom: 24px;
			}
		.new_btn button {
			position: fixed;
			bottom: 30px;
			right: 30px;
			display: block;
			font-size: 16px;
			background-color: green;
			color: white;
			margin: 10px;
			}
		.btn-edit {
			color: white;
			background-color: blue;
		}
		.btn-delete {
			color: white;
			background-color: red;
				}
		.notask {
			text-align: center;
			background-color: skyblue;
			width: 60%;
			margin: 0 auto;
		}
		.logout {
			text-align: right;
			margin-bottom: 20px;
		}
		.pagination {
			text-align: center;
			margin-bottom: 20px;
		}
	</style>
	</head>
	<body>
		<div class="container">
		<h1>タスク管理</h1>
		<div class="logout">
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit" class="btn-logout">ログアウト</button>
			</form>
		</div>
		<div th:if="${taskPage.tasks == null or #lists.isEmpty(taskPage.tasks)}" class="notask">
			<p>現在タスクは登録されていません。「新規作成」から追加してください。</p>
		</div>
		<th:block th:unless="${taskPage.tasks == null or #lists.isEmpty(taskPage.tasks)}">
		<table border="1" style="border-collapse: collapse; width: 100%; margin: 0 auto;">
		<tr>
		 <th>id</th>
		 <th>タイトル</th>
		 <th>内容</th>
		 <th>登録者</th>
		 <th>開始日</th>
		 <th>終了日</th>
		 <th>作成日時</th>
		 <th>更新日時</th>
		 <th>操作</th>
		</tr>
		<tr th:each="rec:${taskPage.tasks}">
			<td th:text="${rec.id}"></td>
			<td th:text="${rec.title}"></td>
			<td th:text="${rec.content}"></td>
			<td th:text="${rec.username}"></td>
			<td th:text="${rec.startDate}"></td>
			<td th:text="${rec.endDate}"></td>
			<td th:text="${rec.createdAt}"></td>
			<td th:text="${rec.updatedAt}"></td>
			<td>
				<a th:href="@{/tasks/{id}/edit(id=${rec.id})}" class="btn-edit">編集</a>
				<form th:action="@{/tasks/{id}/delete(id=${rec.id})}" method="POST" 
				onsubmit="return confirm('削除しますか？');" style="display: inline">
					<button type="submit" class="btn-delete">削除</button>
				</form>
			</td>
		</tr>
		</table>
		</th:block>
		</div>
		<div class="new_btn">
		<a th:href="@{/tasks/new}">
			<button type="button">+ 新規作成</button>
		</a> 
		</div>
		<div class="pagination" th:if="${taskPage.totalPages > 1}">
			<a th:if="${taskPage.hasPrev}"
				th:href="@{/tasks(page=${taskPage.page - 1}, size=${taskPage.size})}">前へ</a>
				
				<span th:each="i : ${#numbers.sequence(0, taskPage.totalPages - 1)}">
					<a th:href="@{/tasks(page=${i}, size=${taskPage.size})}"
					th:text="${i + 1}"
					th:style="${i == taskPage.page} ? 'font-weight:bold;' : ''"></a>
				</span>
				
				<a th:if="${taskPage.hasNext}"
				th:href="@{/tasks(page=${taskPage.page + 1}, size=${taskPage.size})}">次へ</a>
		</div>
	</body>
</html>
