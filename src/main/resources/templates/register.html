<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
        }
        h1 {
            font-size: 36px;
            color: #212529;
            margin-bottom: 24px;
            text-align: center;
        }
        .register-box {
            width: 360px;
            padding: 24px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background-color: #ffffff;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #212529;
            margin-bottom: 8px;
            font-weight: bold;
        }
        /* 入力エリアのスタイル */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #198754;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
		.login-btn {
			text-align: center;
			display: block;
			font-size: 16px;
			color: #0d6efd;
			margin: 10px;
		}
    </style>
</head>
<body>
	<h1>ユーザー登録</h1>
	<div class="register-box">
		<form th:action="@{/register}" th:object="${registerForm}" method="POST">
			<div class="form-group">
				<label for="username">ユーザー名(半角英字)</label>
				<input type="text" id="username" th:field="*{username}">
				<span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:#dc3545;"></span>
			</div>
			<div class="form-group">
				<label for="password">パスワード(半角英数字)</label>
				<input type="password" id="password" th:field="*{password}">
				<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:#dc3545;"></span>
			</div>
			<button type="submit" class="btn-submit">登録</button>
		<a th:href="@{/login}" class="login-btn">ログインはこちら</a>
		</form>
	</div>
</body>
</html>
